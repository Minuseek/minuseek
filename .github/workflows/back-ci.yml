name: Back CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "back/**"
      - ".github/workflows/back-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "back/**"
      - ".github/workflows/back-ci.yml"

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: back/app
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: back/app/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm exec eslint "{src,apps,libs,test}/**/*.ts"

  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: back/app
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: back/app/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

  build:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: back/app
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: back/app/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

  integration:
    name: Intégration
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: back/app
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: minuseek_integration
          POSTGRES_USER: minuseek
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U minuseek -d minuseek_integration"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://minuseek:postgres@localhost:5432/minuseek_integration
      INTEGRATION_DATABASE_URL: postgresql://minuseek:postgres@localhost:5432/minuseek_integration
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: back/app/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Appliquer les migrations sur la base d'intégration
        run: npx prisma migrate deploy

      - name: Suite d'intégration
        run: pnpm jest --config jest.integration.config.js

  migrations:
    name: Migrations à jour
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: back/app
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: minuseek_ci
          POSTGRES_USER: minuseek
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U minuseek -d minuseek_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://minuseek:postgres@localhost:5432/minuseek_ci
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: back/app/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Appliquer les migrations commitées
        run: npx prisma migrate deploy

      # Échoue (exit code 2) si le schéma a un changement non couvert par une migration
      - name: Vérifier qu'aucune migration ne manque
        run: npx prisma migrate diff --from-config-datasource --to-schema prisma --exit-code